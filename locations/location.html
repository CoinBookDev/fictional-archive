<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fictional Archive | Location</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="locations.css">

    <style>
        /* =========================================
           LOCATION PROFILE
        ========================================= */

        .location-profile {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .location-hero {
            position: relative;
            min-height: 300px;
            background: var(--card-background, #1b1b1b);
            border: 1px solid var(--border-color, #333);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            margin-top: 30px;
        }

        .location-hero-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .location-hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.9),
                rgba(0, 0, 0, 0.1)
            );
        }

        .location-hero-content {
            position: relative;
            z-index: 1;
            padding: 35px;
            color: white;
        }

        .location-hero-content .eyebrow {
            color: #ccc;
        }

        .location-hero-content h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin: 10px 0;
        }

        .location-hero-content p {
            color: #ddd;
            margin: 0;
        }

        .location-profile-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            margin-top: 30px;
        }

        .location-panel {
            border: 1px solid var(--border-color, #333);
            border-radius: 10px;
            padding: 25px;
            background: var(--card-background, transparent);
        }

        .location-panel h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .location-description {
            line-height: 1.8;
            white-space: pre-line;
        }

        .location-information {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .location-information-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .location-information-label {
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: var(--text-secondary, #999);
        }

        .location-information-value {
            font-size: 0.95rem;
        }

        .location-link {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid currentColor;
            width: fit-content;
        }

        .location-link:hover {
            opacity: 0.7;
        }

        .location-children {
            margin-top: 30px;
        }

        .location-children-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
        }

        .location-child-card {
            display: block;
            padding: 20px;
            border: 1px solid var(--border-color, #333);
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, border-color 0.2s;
        }

        .location-child-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color, #888);
        }

        .location-child-type {
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: var(--text-secondary, #999);
            margin-bottom: 10px;
        }

        .location-child-card h3 {
            margin: 0 0 8px;
        }

        .location-child-card p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-secondary, #999);
            line-height: 1.5;
        }

        .location-back-link {
            display: inline-block;
            margin-top: 30px;
            color: inherit;
            text-decoration: none;
            opacity: 0.7;
        }

        .location-back-link:hover {
            opacity: 1;
        }

        @media (max-width: 800px) {
            .location-profile-grid {
                grid-template-columns: 1fr;
            }

            .location-children-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 550px) {
            .location-profile {
                padding: 20px;
            }

            .location-hero {
                min-height: 250px;
            }

            .location-hero-content {
                padding: 22px;
            }

            .location-children-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>
